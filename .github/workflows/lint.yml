name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ruff (Python lint)
        run: |
          pip install ruff
          ruff check .

      - name: Validate skills (frontmatter + CHANGELOG)
        run: python3 scripts/lint_skills.py

      # 固定タグの公式イメージを使う（main の生スクリプトを取得して無検証で実行しない）。
      # 版を上げるときはタグを書き換える: https://github.com/rhysd/actionlint/releases
      - name: actionlint (workflow files)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
